name: Windows Package Smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Package Setup and Portable
        shell: powershell
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Packaging attempt $attempt/$maxAttempts"
            if (Test-Path ci-dist) { Remove-Item ci-dist -Recurse -Force }
            npm run package:win:ci
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Start-Sleep -Seconds (10 * $attempt)
          }
      - name: Smoke real EXEs
        shell: powershell
        run: ./scripts/windows-package-smoke.ps1 -ArtifactsDir ci-dist
      - name: Upload package smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.os }}
          path: |
            test-artifacts/package-smoke/**
            ci-dist/*.exe
          retention-days: 7
