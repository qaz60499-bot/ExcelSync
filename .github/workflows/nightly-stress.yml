name: Nightly Stress
on:
  workflow_dispatch:
    inputs:
      file_count:
        description: Optional custom file count (1-1000). Empty runs 50 and 500.
        required: false
        default: ''
  schedule:
    - cron: '25 9 * * *'
    - cron: '25 10 * * 0'
permissions:
  contents: read
jobs:
  daily-baseline:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '25 9 * * *') || (github.event_name == 'workflow_dispatch' && inputs.file_count == '') }}
    strategy:
      fail-fast: false
      matrix:
        file_count: [50, 500]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      EXCELSYNC_STRESS_FILES: ${{ matrix.file_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Queue/restart stress
        run: npx vitest run tests/queue-stress-e2e.test.ts --reporter=verbose
      - name: Queue priority and durable DB regression
        run: npx vitest run tests/queue-priority.test.ts tests/db.test.ts --reporter=verbose --no-file-parallelism
      - name: Print stress report
        if: always()
        shell: powershell
        run: if (Test-Path test-artifacts/stress/test-report.json) { Get-Content test-artifacts/stress/test-report.json }
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ env.EXCELSYNC_STRESS_FILES }}-${{ github.run_id }}
          path: test-artifacts/stress/**
          if-no-files-found: warn
          retention-days: 14

  custom-stress:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.file_count != '' }}
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      EXCELSYNC_STRESS_FILES: ${{ inputs.file_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Custom queue/restart stress
        run: npx vitest run tests/queue-stress-e2e.test.ts --reporter=verbose
      - name: Queue priority and durable DB regression
        run: npx vitest run tests/queue-priority.test.ts tests/db.test.ts --reporter=verbose --no-file-parallelism
      - name: Print stress report
        if: always()
        shell: powershell
        run: if (Test-Path test-artifacts/stress/test-report.json) { Get-Content test-artifacts/stress/test-report.json }
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-${{ env.EXCELSYNC_STRESS_FILES }}-${{ github.run_id }}
          path: test-artifacts/stress/**
          if-no-files-found: warn
          retention-days: 30

  weekly-1000:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '25 10 * * 0' }}
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      EXCELSYNC_STRESS_FILES: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Weekly 1000-file queue/restart stress
        run: npx vitest run tests/queue-stress-e2e.test.ts --reporter=verbose
      - name: Queue priority and durable DB regression
        run: npx vitest run tests/queue-priority.test.ts tests/db.test.ts --reporter=verbose --no-file-parallelism
      - name: Print stress report
        if: always()
        shell: powershell
        run: if (Test-Path test-artifacts/stress/test-report.json) { Get-Content test-artifacts/stress/test-report.json }
      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-1000-${{ github.run_id }}
          path: test-artifacts/stress/**
          if-no-files-found: warn
          retention-days: 30
