name: Release Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/ci-security-check.cjs
      - run: npm run typecheck
      - run: npx vitest run --reporter=verbose
      - run: npm run build
      - run: npm run worker:deploy:dry

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci
      - run: npm run package:win:ci
      - shell: powershell
        run: ./scripts/windows-package-smoke.ps1 -ArtifactsDir ci-dist
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.os }}-${{ github.run_id }}
          path: test-artifacts/package-smoke/**
          if-no-files-found: warn
          retention-days: 14

  transaction-security:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Auth, transaction, fault, permission and admin regression
        run: >-
          npx vitest run
          tests/api-fault-injection.test.ts
          tests/sync-engine.test.ts
          tests/state-machine-abuse.test.ts
          tests/login-security.test.ts
          tests/security-bruteforce-boundary.test.ts
          tests/enterprise-acl-1.3.1.test.ts
          tests/enterprise-security.test.ts
          tests/enterprise-e2e.test.ts
          tests/worker-trash.test.ts
          tests/collaboration-upgrade.test.ts
          --reporter=verbose --reporter=json
          --outputFile.json=test-artifacts/release-transaction/vitest.json
      - name: Transaction report
        if: always()
        run: node scripts/ci-vitest-report.cjs --input=test-artifacts/release-transaction/vitest.json --suite="Release Transaction Security" --output-dir=test-artifacts/release-transaction
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-transaction-${{ github.run_id }}
          path: test-artifacts/release-transaction/**
          if-no-files-found: warn
          retention-days: 14

  staging-saas:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_STAGING_CONFIRMATION: ${{ secrets.E2E_STAGING_CONFIRMATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/staging-saas-e2e.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-staging-${{ github.run_id }}
          path: test-artifacts/saas-e2e/**
          if-no-files-found: warn
          retention-days: 14

  candidate:
    if: always()
    needs: [core, package-smoke, transaction-security, staging-saas]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build release gate report
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-artifacts/release-gate | Out-Null
          $core='${{ needs.core.result }}'
          $package='${{ needs.package-smoke.result }}'
          $transaction='${{ needs.transaction-security.result }}'
          $staging='${{ needs.staging-saas.result }}'
          $ok = ($core -eq 'success' -and $package -eq 'success' -and $transaction -eq 'success' -and $staging -eq 'success')
          $conclusion = if ($ok) { 'PASS' } else { 'BLOCKED' }
          $report = [ordered]@{
            environment = [ordered]@{ commit_sha='${{ github.sha }}'; excelsync_version=(Get-Content package.json|ConvertFrom-Json).version; runner_os=$env:RUNNER_OS; runner_image=$env:ImageOS; start_end='see component artifacts' }
            core_windows_2022_2025=$core
            package_smoke_windows_2022_2025=$package
            auth_sync_fault_permissions=$transaction
            staging_saas=$staging
            conclusion=$conclusion
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content test-artifacts/release-gate/test-report.json
          @("# Release Gate",'',"Core: $core","Package smoke: $package","Transaction/security: $transaction","Staging SaaS: $staging",'',"Conclusion: **$conclusion**") -join "`n" | Set-Content test-artifacts/release-gate/test-report.md
          if (-not $ok) { Write-Host 'Candidate is NOT allowed: one or more required gates are not successful.' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.run_id }}
          path: test-artifacts/release-gate/**
          retention-days: 30
      - name: Enforce candidate gate
        shell: powershell
        run: |
          if ('${{ needs.core.result }}' -ne 'success' -or '${{ needs.package-smoke.result }}' -ne 'success' -or '${{ needs.transaction-security.result }}' -ne 'success' -or '${{ needs.staging-saas.result }}' -ne 'success') { throw 'Release Candidate gate is BLOCKED' }
